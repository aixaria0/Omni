name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static Pages bundle
        env:
          GITHUB_PAGES: "true"
          VITE_STATIC_PAGES: "true"
          VITE_AUTH_ENABLED: "false"
        run: npm run build:dev
      - name: Prepare Pages artifact
        run: |
          test -f dist/client/index.html
          CLIENT_CSS="$(basename "$(find dist/client/assets -maxdepth 1 -name 'styles-*.css' | head -n 1)")"
          test -n "$CLIENT_CSS"
          python3 - "$CLIENT_CSS" <<'PY'
          from pathlib import Path
          import re, sys
          css = sys.argv[1]
          p = Path("dist/client/index.html")
          html = p.read_text()
          html = re.sub(r"/Omni/assets/styles-[A-Za-z0-9_-]+\.css", f"/Omni/assets/{css}", html)
          p.write_text(html)
          PY
          cp dist/client/index.html dist/client/404.html
          mkdir -p dist/client/__grok
          cat > dist/client/__grok/manifest.webmanifest <<'EOF'
          {
            "name": "OMNI — Evidence Intelligence Runtime",
            "short_name": "OMNI",
            "start_url": "/Omni/",
            "scope": "/Omni/",
            "display": "standalone",
            "background_color": "#020805",
            "theme_color": "#020805",
            "icons": [{"src":"icon-180.png","sizes":"180x180","type":"image/png"}]
          }
          EOF
          touch dist/client/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
