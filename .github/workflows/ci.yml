name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core, OSINT, and quantum tests
        run: npm run test:core
      - name: Existing platform-script baseline
        continue-on-error: true
        run: npm run test:platform
      - run: npm run typecheck
      - run: npm run build:dev
